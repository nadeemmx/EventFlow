name: eventflow_app
description: "EventFlow SaaS - Event Management Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  dio: ^5.7.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  go_router: ^15.1.2
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_it: ^8.0.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  connectivity_plus: ^6.1.4
  pull_to_refresh: ^2.0.0
  razorpay_flutter: ^1.3.7
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  fl_chart: ^0.70.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^3.0.3
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#D4A843"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#D4A843"
  image: "assets/images/logo.png"
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
