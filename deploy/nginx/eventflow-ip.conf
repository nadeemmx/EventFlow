# EventFlow - Nginx Configuration (IP-based, no domain/TLS)
# Place in /etc/nginx/sites-available/eventflow

# Hide Nginx version
server_tokens off;

# Upstream: Gunicorn backend
upstream eventflow_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=20r/s;

# API on port 80 (IP-based)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request size limit (matches DATA_UPLOAD_MAX_MEMORY_SIZE)
    client_max_body_size 10M;

    # Block sensitive files
    location ~ /\.(env|git|htaccess|htpasswd|svn) {
        deny all;
        return 404;
    }

    # Block media execution
    location ~* \.(php|php[0-9s]*|phtml|pht|phps|cgi|pl|py|asp|aspx|jsp|sh|bash|exe|bat|cmd|com|msi|scr|vbs|vbe|ps1|dll|hta)$ {
        deny all;
        return 404;
    }

    # Frontend static files
    root /home/eventflow/frontend/public_html;
    index index.html;

    # Frontend SPA routing
    location / {
        # Try frontend first, then proxy to API
        try_files $uri $uri/ @api;
    }

    # API proxy
    location @api {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Rate-limit auth endpoints
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Rate-limit webhook endpoint
    location /api/v1/payments/webhook/ {
        limit_req zone=webhook burst=20 nodelay;
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Health checks (no rate limit)
    location /health/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location /ready/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location /live/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Admin (Django admin)
    location /admin/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}

# Media server on port 8080
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Media files
    root /home/eventflow/media;

    # Block sensitive files
    location ~ /\.(env|git|htaccess|htpasswd|svn) {
        deny all;
        return 404;
    }

    # Only serve allowed file types
    location ~* \.(jpg|jpeg|png|gif|webp|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block dangerous file types
    location ~* \.(php|php[0-9s]*|phtml|pht|phps|cgi|pl|py|asp|aspx|jsp|sh|bash|exe|bat|cmd|com|msi|scr|vbs|vbe|ps1|dll|hta)$ {
        deny all;
        return 404;
    }

    # Block directory listing
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }
}
