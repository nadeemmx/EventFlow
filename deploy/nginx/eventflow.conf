# EventFlow - Nginx Configuration (DOMAIN TEMPLATE)
#
# This file contains at-sign placeholders (at-sign + NAME + at-sign, e.g.
# the API hostname token) and CANNOT be installed directly. Render it first:
#
#   deploy/scripts/render_nginx_config.sh [API_HOST] [APP_HOST] [MEDIA_HOST] [CERT_NAME] -o /etc/nginx/sites-available/eventflow
#
# Defaults: api.eventflow.com / app.eventflow.com / media.eventflow.com /
# cert live-dir eventflow.com (the historical values — override with YOUR
# domains; nothing here invents a domain for you).
#
# Frontend serving model: `next build` + `next start` on 127.0.0.1:3000
# (systemd unit eventflow-frontend.service). There is no static out/ dir.

# Hide Nginx version
server_tokens off;

# Upstream: Gunicorn backend
upstream eventflow_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# Upstream: Next.js frontend (next start)
upstream eventflow_frontend {
    server 127.0.0.1:3000 fail_timeout=0;
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=20r/s;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name @APP_HOST@ @API_HOST@ @MEDIA_HOST@;

    # Allow Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend: @APP_HOST@
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @APP_HOST@;

    # TLS Configuration (update CERT_NAME if your cert is not under the apex)
    ssl_certificate /etc/letsencrypt/live/@CERT_NAME@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@CERT_NAME@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No "preload": preload entries are effectively irreversible and require
    # every subdomain to be HTTPS-ready before submission.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://@API_HOST@; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Request size limit (matches DATA_UPLOAD_MAX_MEMORY_SIZE)
    client_max_body_size 10M;

    # Block sensitive files (must stay ABOVE the /media/ allowlist regex so
    # it wins nginx's first-matching-regex rule). Executable-type blocking is
    # deliberately NOT done here: this server proxies to Next/Gunicorn, so a
    # regex covering .js/.css would break frontend and admin assets.
    location ~ /\.(env|git|htaccess|htpasswd|svn) {
        deny all;
        return 404;
    }

    # ---- Public media (privacy allowlist) -------------------------------
    # MEDIA_URL is "/media/", so the browser requests media on this origin.
    # ONLY public trees are served (tenant logos/settings, venue images,
    # invoice logos, branding). Everything else under /media/ — contracts,
    # invoice PDFs, applicant resumes — returns 404 here and must be
    # downloaded through the authenticated Django endpoints instead.
    location /media/ {
        return 404;
    }

    location ~ ^/media/((?:tenants/(?:logos|settings)/|venues/|invoices/logos/|branding/)[^/].*)$ {
        alias /home/eventflow/media/$1;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    # --------------------------------------------------------------------

    # Next.js assets are served by `next start` itself (immutable digests)
    location /_next/ {
        proxy_pass http://eventflow_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Frontend application (all remaining routes)
    location / {
        proxy_pass http://eventflow_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}

# API: @API_HOST@
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @API_HOST@;

    # TLS Configuration
    ssl_certificate /etc/letsencrypt/live/@CERT_NAME@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@CERT_NAME@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request size limit (matches DATA_UPLOAD_MAX_MEMORY_SIZE)
    client_max_body_size 10M;

    # Block sensitive files (order matters — see frontend server; no
    # executable-type regex here because Django admin /static/*.js is
    # proxied through this server)
    location ~ /\.(env|git|htaccess|htpasswd|svn) {
        deny all;
        return 404;
    }

    # Public media allowlist (same rules as the frontend server)
    location /media/ {
        return 404;
    }

    location ~ ^/media/((?:tenants/(?:logos|settings)/|venues/|invoices/logos/|branding/)[^/].*)$ {
        alias /home/eventflow/media/$1;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Health check (no rate limit, no security headers needed)
    location /health/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location /ready/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location /live/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Rate-limit auth endpoints more strictly
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Rate-limit webhook endpoint
    location /api/v1/payments/webhook/ {
        limit_req zone=webhook burst=20 nodelay;
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Proxy to Gunicorn
    location / {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

# Media: @MEDIA_HOST@ (optional origin for public media)
# Serves the SAME allowlist as /media/ above. Private document trees are
# never served here; they stream from authenticated Django endpoints.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @MEDIA_HOST@;

    # TLS Configuration
    ssl_certificate /etc/letsencrypt/live/@CERT_NAME@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@CERT_NAME@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block sensitive files (first matching regex wins)
    location ~ /\.(env|git|htaccess|htpasswd|svn) {
        deny all;
        return 404;
    }

    # Block executable/interpretable types before the media allowlist
    location ~* \.(php|php[0-9s]*|phtml|pht|phps|cgi|pl|py|asp|aspx|jsp|sh|bash|exe|bat|cmd|com|msi|scr|vbs|vbe|js|wsf|wsc|wsh|ps1|psm1|reg|dll|hta|cpl|lnk|inf|rgs|sct|shb|shs)$ {
        deny all;
        return 404;
    }

    # Allowlist (matches both /media/<tree>/... and /<tree>/... forms)
    location ~ ^/(?:media/)?((?:tenants/(?:logos|settings)/|venues/|invoices/logos/|branding/)[^/].*)$ {
        alias /home/eventflow/media/$1;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Everything else (directory listing, private document trees, ...)
    autoindex off;
    location / {
        return 404;
    }
}
