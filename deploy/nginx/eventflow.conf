# EventFlow - Nginx Configuration for VPS Deployment
# Place this in /etc/nginx/sites-available/eventflow
# Symlink to /etc/nginx/sites-enabled/eventflow

# Hide Nginx version
server_tokens off;

# Upstream: Gunicorn backend
upstream eventflow_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=20r/s;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name app.eventflow.com api.eventflow.com media.eventflow.com;

    # Allow Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend: app.eventflow.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.eventflow.com;

    # TLS Configuration (update paths to your actual certs)
    ssl_certificate /etc/letsencrypt/live/eventflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eventflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.eventflow.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Block sensitive files
    location ~ /\.(env|git|htaccess|htpasswd|svn) {
        deny all;
        return 404;
    }

    # Frontend static files
    root /home/eventflow/frontend/public_html;
    index index.html;

    # SPA routing - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Disable access log for static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# API: api.eventflow.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.eventflow.com;

    # TLS Configuration
    ssl_certificate /etc/letsencrypt/live/eventflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eventflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request size limit (matches DATA_UPLOAD_MAX_MEMORY_SIZE)
    client_max_body_size 10M;

    # Block sensitive files
    location ~ /\.(env|git|htaccess|htpasswd|svn) {
        deny all;
        return 404;
    }

    # Health check (no rate limit, no security headers needed)
    location /health/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location /ready/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location /live/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Rate-limit auth endpoints more strictly
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Rate-limit webhook endpoint
    location /api/v1/payments/webhook/ {
        limit_req zone=webhook burst=20 nodelay;
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Proxy to Gunicorn
    location / {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}

# Media: media.eventflow.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.eventflow.com;

    # TLS Configuration
    ssl_certificate /etc/letsencrypt/live/eventflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eventflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Media files
    root /home/eventflow/media;

    # Block sensitive files
    location ~ /\.(env|git|htaccess|htpasswd|svn) {
        deny all;
        return 404;
    }

    # Only serve allowed file types
    location ~* \.(jpg|jpeg|png|gif|webp|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block all potentially dangerous file types
    location ~* \.(php|php[0-9s]*|phtml|pht|phps|cgi|pl|py|asp|aspx|jsp|sh|bash|exe|bat|cmd|com|msi|scr|vbs|vbe|js|wsf|wsc|wsh|ps1|psm1|reg|dll|hta|cpl|lnk|inf|rgs|sct|shb|shs)$ {
        deny all;
        return 404;
    }

    # Block directory listing
    autoindex off;
}
