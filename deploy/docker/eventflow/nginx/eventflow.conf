# EventFlow — container Nginx configuration (Compose project network).
#
# Docker-native sibling of deploy/nginx/eventflow-ip.conf (legacy host
# install): identical routing, rate limits and media allowlist — only the
# upstream addresses differ (Docker DNS service names instead of
# 127.0.0.1) and /static/ is proxied to the backend exactly as before
# (WhiteNoise serves it).
#
# KEEP IN SYNC with deploy/nginx/eventflow-ip.conf when routing rules
# change (two runtimes coexist during the migration; the host-installed
# config is retired once Docker is the only deployment path).
#
# Mounted as /etc/nginx/conf.d/default.conf inside the nginx service.
# NOTE: `upstream server <name>` is resolved by nginx at startup — the
# backend/frontend containers must exist first (compose depends_on
# handles this). After a backend container is recreated, reload nginx so
# it re-resolves the address: deploy_compose.sh does this after every
# `up -d` (`nginx -s reload`, graceful).

# Hide Nginx version
server_tokens off;

# Upstream: Gunicorn backend (Docker DNS)
upstream eventflow_backend {
    server backend:8000 fail_timeout=0;
    keepalive 32;
}

# Upstream: Next.js frontend (`next start` on port 3000)
upstream eventflow_frontend {
    server frontend:3000 fail_timeout=0;
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=20r/s;

# App + API on port 80 (IP-based, no domain/TLS yet)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request size limit (matches DATA_UPLOAD_MAX_MEMORY_SIZE)
    client_max_body_size 10M;

    # Container self-check (compose healthcheck + post-deploy verification).
    # Reserved path — the Next.js app has no /nginx-health route.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Block sensitive files (first matching regex wins)
    location ~ /\.(env|git|htaccess|htpasswd|svn) {
        deny all;
        return 404;
    }

    # ---- Public media (privacy allowlist) -------------------------------
    # Only tenant logos/settings, venue images, invoice logos and branding
    # are served. Contracts, invoice PDFs and applicant resumes return 404
    # and must go through the authenticated Django endpoints.
    location /media/ {
        return 404;
    }

    location ~ ^/media/((?:tenants/(?:logos|settings)/|venues/|invoices/logos/|branding/)[^/].*)$ {
        alias /home/eventflow/media/$1;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    # --------------------------------------------------------------------

    # API proxy
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Rate-limit auth endpoints
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Rate-limit webhook endpoint (unavailable until HTTPS — see docs)
    location /api/v1/payments/webhook/ {
        limit_req zone=webhook burst=20 nodelay;
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Health checks (no rate limit)
    location /health/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location /ready/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location /live/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Admin (Django admin)
    location /admin/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django/WhiteNoise static files (admin CSS/JS/fonts)
    location /static/ {
        proxy_pass http://eventflow_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Next.js assets (immutable digests) served by `next start`
    location /_next/ {
        proxy_pass http://eventflow_frontend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Frontend application — everything else belongs to Next.js, which also
    # renders the 404 page for unknown routes.
    location / {
        proxy_pass http://eventflow_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}

# Media server on port 8080 (same privacy allowlist)
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Block sensitive files (first matching regex wins)
    location ~ /\.(env|git|htaccess|htpasswd|svn) {
        deny all;
        return 404;
    }

    # Block executable/interpretable types before the allowlist
    location ~* \.(php|php[0-9s]*|phtml|pht|phps|cgi|pl|py|asp|aspx|jsp|sh|bash|exe|bat|cmd|com|msi|scr|vbs|vbe|ps1|dll|hta)$ {
        deny all;
        return 404;
    }

    # Allowlist (matches both /media/<tree>/... and /<tree>/... forms)
    location ~ ^/(?:media/)?((?:tenants/(?:logos|settings)/|venues/|invoices/logos/|branding/)[^/].*)$ {
        alias /home/eventflow/media/$1;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Everything else (directory listing, private document trees, ...)
    autoindex off;

    location / {
        return 404;
    }
}
