name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege: every job only needs to read the repository.
permissions:
  contents: read

# One run per ref; a newer push to the same ref cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      # Test settings (backend/pytest.ini → config.settings.test) use
      # SQLite in-memory + LocMemCache, so no MySQL/Redis service is needed
      # here; production uses MariaDB/Redis on the VPS (smoke_test.sh and
      # /ready/ cover those on the live server).
      - name: Django system check
        run: DJANGO_SETTINGS_MODULE=config.settings.test python manage.py check

      - name: Run test suite
        run: pytest tests/ -q --tb=short

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # next.config.mjs sets typescript.ignoreBuildErrors=true, so the build
      # alone would not surface type errors — run tsc explicitly.
      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Production build
        env:
          # next.config.mjs fails the build without NEXT_PUBLIC_API_URL.
          # The value is inlined into the client bundle (never deployed from
          # CI as an artifact — the VPS rebuilds the frontend at deploy time).
          # Override with the repository variable NEXT_PUBLIC_API_URL.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://194.77.89.95/api/v1' }}
        run: npm run build

      - name: Verify build-time variable was inlined
        env:
          EXPECTED_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://194.77.89.95/api/v1' }}
        run: |
          set -euo pipefail
          if ! grep -RFq -- "$EXPECTED_API_URL" .next; then
            echo "::error::NEXT_PUBLIC_API_URL ($EXPECTED_API_URL) not found in .next/ — build-time inlining failed"
            exit 1
          fi
          echo "OK: $EXPECTED_API_URL is present in the production bundle"

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  deploy-scripts:
    name: Deploy scripts & configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax check (bash -n)
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::no shell scripts found in the repository"
            exit 1
          fi
          for s in "${scripts[@]}"; do
            bash -n "$s"
          done
          echo "OK: bash -n on ${#scripts[@]} scripts"

      - name: ShellCheck (errors)
        run: |
          set -euo pipefail
          shellcheck --version
          # -S error: hard defects only (warnings are reviewed locally).
          # Installed by default on the GitHub-hosted ubuntu runners.
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck -S error -x "${scripts[@]}"
          echo "OK: shellcheck found no errors"

      - name: actionlint (workflow syntax, expressions, step shells)
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color
          echo "OK: actionlint passed"

      - name: Nginx configuration test (IP mode)
        run: |
          set -euo pipefail
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq nginx
          fi
          # The package auto-starts nginx, which would hold :80/:443 and make
          # the bind test inside `nginx -t` fail with EADDRINUSE.
          sudo systemctl stop nginx 2>/dev/null || sudo nginx -s stop 2>/dev/null || true
          # eventflow-ip.conf is a complete http-level config (server_tokens,
          # upstreams, limit_req_zone, server blocks), so it can be included
          # in a minimal main config for `nginx -t`.
          WORKDIR=$(mktemp -d)
          {
            echo "events { worker_connections 64; }"
            echo "http {"
            echo "    include ${GITHUB_WORKSPACE}/deploy/nginx/eventflow-ip.conf;"
            echo "}"
          } > "${WORKDIR}/nginx.conf"
          sudo nginx -t -c "${WORKDIR}/nginx.conf"

      - name: Nginx domain template renders and validates
        run: |
          set -euo pipefail
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq nginx
          fi
          # Same as the IP step: free :80/:443 before the bind test.
          sudo systemctl stop nginx 2>/dev/null || sudo nginx -s stop 2>/dev/null || true
          WORKDIR=$(mktemp -d)
          out="${WORKDIR}/eventflow.conf"
          deploy/scripts/render_nginx_config.sh \
            api.ci.example app.ci.example media.ci.example ci.example -o "${out}"
          grep -q "eventflow_backend" "${out}"
          grep -q "eventflow_frontend" "${out}"
          if grep -Eq '@[A-Z_][A-Z_]*@' "${out}"; then
            echo "::error::rendered config still contains placeholders"
            exit 1
          fi
          # Real `nginx -t` on the rendered config. Only the certificate
          # paths are swapped to a throwaway self-signed pair (the template
          # hardcodes /etc/letsencrypt/...); hosts, ports and all directives
          # are validated as-is. Upstreams use 127.0.0.1, so no DNS needed.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci.local" \
            -keyout "${WORKDIR}/privkey.pem" -out "${WORKDIR}/fullchain.pem" >/dev/null 2>&1
          sed -i "s|/etc/letsencrypt/live/ci.example/|${WORKDIR}/|g" "${out}"
          {
            echo "events { worker_connections 64; }"
            echo "http {"
            echo "    include ${out};"
            echo "}"
          } > "${WORKDIR}/nginx.conf"
          sudo nginx -t -c "${WORKDIR}/nginx.conf"
          echo "OK: rendered domain template passed nginx -t"

      - name: systemd units are structurally valid
        run: |
          set -euo pipefail
          for unit in deploy/systemd/*.service; do
            grep -q '^\[Unit\]'    "${unit}" || { echo "::error::${unit}: missing [Unit]";   exit 1; }
            grep -q '^\[Service\]' "${unit}" || { echo "::error::${unit}: missing [Service]"; exit 1; }
            grep -q '^ExecStart='  "${unit}" || { echo "::error::${unit}: missing ExecStart"; exit 1; }
            echo "OK: ${unit}"
          done

  docker:
    name: Docker images & Compose
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # packages: write is needed to publish the images to GitHub Container
    # Registry. The publish step itself only runs for a push to master —
    # a pull request never pushes, and the build context never sees the
    # token (it is only used by the registry login).
    permissions:
      contents: read
      packages: write

    env:
      # GHCR namespace. GHCR rejects uppercase repository names, so the
      # owner is validated below before it is used in a tag.
      IMAGE_OWNER: ${{ github.repository_owner }}
      IMAGE_REGISTRY: ghcr.io
      # Only a push to master publishes images. Pull requests build and
      # smoke-test locally, but never push.
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      # Build input for the frontend image (baked into the browser bundle).
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://194.77.89.95/api/v1' }}

    steps:
      - uses: actions/checkout@v7

      # The VPS checkout is a sparse bundle of exactly these three paths
      # (deploy_compose.sh / bootstrap_vps.sh). Build and smoke-test that
      # bundle — not the full workspace — so CI proves a deploy cannot
      # depend on files the server will never have on disk.
      - name: Deployment bundle (sparse checkout)
        run: |
          set -euo pipefail
          BUNDLE=/tmp/eventflow-bundle
          rm -rf "$BUNDLE"
          git clone --quiet --no-checkout "$GITHUB_WORKSPACE" "$BUNDLE"
          git -C "$BUNDLE" sparse-checkout init --no-cone
          git -C "$BUNDLE" sparse-checkout set /backend/ /frontend/ /deploy/docker/
          git -C "$BUNDLE" checkout --quiet

          required=(
            backend/Dockerfile
            backend/.dockerignore
            backend/requirements/production.txt
            frontend/Dockerfile
            frontend/.dockerignore
            frontend/package.json
            frontend/package-lock.json
            frontend/next.config.mjs
            frontend/public/.gitkeep
            deploy/docker/deploy_compose.sh
            deploy/docker/crontab.txt
            deploy/docker/eventflow/docker-compose.yml
            deploy/docker/eventflow/nginx/eventflow.conf
            deploy/docker/eventflow/.env.example
            deploy/docker/scripts/lib.sh
            deploy/docker/scripts/compose_run.sh
            deploy/docker/scripts/verify.sh
            deploy/docker/scripts/backup.sh
            deploy/docker/scripts/restore.sh
            deploy/docker/scripts/rollback.sh
          )
          for f in "${required[@]}"; do
            [ -f "${BUNDLE}/${f}" ] || { echo "::error::sparse bundle is missing ${f}"; exit 1; }
          done
          excluded=(
            mobile_app backend-build docs .github \
            deploy/deploy_production.sh deploy/deploy_vps.sh deploy/deploy.sh \
            deploy/bootstrap deploy/scripts deploy/systemd
          )
          for d in "${excluded[@]}"; do
            [ ! -e "${BUNDLE}/${d}" ] || { echo "::error::sparse bundle must not contain ${d}"; exit 1; }
          done
          files=$(find "$BUNDLE" -path "$BUNDLE/.git" -prune -o -type f -print | wc -l)
          echo "OK: sparse bundle (${files} files, excluded mobile_app/backend-build/docs/legacy deploy)"
          echo "BUNDLE_DIR=${BUNDLE}" >> "$GITHUB_ENV"

      # ---- image coordinates ----------------------------------------------
      # The tag is the commit SHA: immutable, and the same value the VPS
      # deploys and rolls back to. The owner must be lowercase (GHCR
      # rejects uppercase repository names).
      - name: Validate image coordinates
        run: |
          set -euo pipefail
          printf '%s' "${IMAGE_OWNER}" | grep -Eq '^[a-z0-9][a-z0-9._-]*$' || {
            echo "::error::IMAGE_OWNER (${IMAGE_OWNER}) must be lowercase for GHCR"
            exit 1
          }
          printf '%s' "${GITHUB_SHA}" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::GITHUB_SHA is not a full commit SHA: ${GITHUB_SHA}"
            exit 1
          }
          echo "BACKEND_IMAGE=${IMAGE_REGISTRY}/${IMAGE_OWNER}/eventflow-backend:${GITHUB_SHA}"  >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${IMAGE_REGISTRY}/${IMAGE_OWNER}/eventflow-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "OK: ${IMAGE_REGISTRY}/${IMAGE_OWNER}/eventflow-{backend,frontend}:${GITHUB_SHA}"

      # The .env.example placeholders satisfy every required ${VAR:?…}
      # interpolation — this validates the file structure without secrets.
      - name: Compose configuration validates
        run: |
          set -euo pipefail
          docker compose \
            --env-file "${BUNDLE_DIR}/deploy/docker/eventflow/.env.example" \
            -f "${BUNDLE_DIR}/deploy/docker/eventflow/docker-compose.yml" \
            config -q
          echo "OK: docker compose config (eventflow stack, sparse bundle)"

      # The VPS pulls the images — it must never build them. A `build:`
      # section left in the compose file would let a deploy fall back to
      # building on the 9.8 GB server, which is exactly what broke.
      - name: Compose does not build the application images
        run: |
          set -euo pipefail
          compose_file="${BUNDLE_DIR}/deploy/docker/eventflow/docker-compose.yml"
          if grep -Eq '^[[:space:]]+build:' "$compose_file"; then
            echo "::error::the compose file still has a build: section — the VPS must pull, never build"
            exit 1
          fi
          resolved="$(docker compose \
            --env-file "${BUNDLE_DIR}/deploy/docker/eventflow/.env.example" \
            -f "$compose_file" \
            config --images)"
          printf '%s\n' "$resolved" | grep -q "eventflow-backend:local" || {
            echo "::error::the backend image does not resolve to the registry reference:"
            printf '%s\n' "$resolved"
            exit 1
          }
          printf '%s\n' "$resolved" | grep -q "eventflow-frontend:local" || {
            echo "::error::the frontend image does not resolve to the registry reference:"
            printf '%s\n' "$resolved"
            exit 1
          }
          echo "OK: application images are pulled, not built"
          printf '%s\n' "$resolved"

      - name: Hadolint (Dockerfiles, errors only)
        run: |
          set -euo pipefail
          # Failure threshold "error": style/warning findings (e.g. unpinned
          # apt package versions, which break across mirror snapshots) are
          # reported by hadolint but do not fail the build.
          # The image has no ENTRYPOINT (Cmd is /bin/hadolint -), so the
          # binary must be named: trailing args replace Cmd, they do not
          # extend it, and `docker run … --failure-threshold` would be
          # treated as the container command.
          docker run --rm -i hadolint/hadolint:v2.12.0 /bin/hadolint --failure-threshold error - < backend/Dockerfile
          docker run --rm -i hadolint/hadolint:v2.12.0 /bin/hadolint --failure-threshold error - < frontend/Dockerfile
          echo "OK: hadolint (no errors)"

      - name: Nginx container config validates (nginx -t)
        run: |
          set -euo pipefail
          if ! command -v nginx >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq nginx
          fi
          sudo systemctl stop nginx 2>/dev/null || sudo nginx -s stop 2>/dev/null || true
          # nginx resolves `upstream server <name>` at startup — map the
          # Docker service names to loopback for this config-only test.
          echo "127.0.0.1 backend frontend" | sudo tee -a /etc/hosts >/dev/null
          WORKDIR=$(mktemp -d)
          {
            echo "events { worker_connections 64; }"
            echo "http {"
            echo "    include ${GITHUB_WORKSPACE}/deploy/docker/eventflow/nginx/eventflow.conf;"
            echo "}"
          } > "${WORKDIR}/nginx.conf"
          sudo nginx -t -c "${WORKDIR}/nginx.conf"
          echo "OK: container nginx config passed nginx -t"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Both images are built from the sparse bundle (the same context the
      # VPS checkout provides) and are LOADED into the runner's daemon, so
      # the smoke tests below run against exactly the image that is
      # published afterwards.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUNDLE_DIR }}/backend
          file: ${{ env.BUNDLE_DIR }}/backend/Dockerfile
          tags: ${{ env.BACKEND_IMAGE }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          load: true
          # Reading the cache is always allowed; WRITING it is not allowed
          # for a pull request from a fork (the cache service answers 403),
          # so the export only happens for a push to master.
          cache-from: type=gha
          cache-to: ${{ env.IS_RELEASE == 'true' && 'type=gha,mode=max' || '' }}

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUNDLE_DIR }}/frontend
          file: ${{ env.BUNDLE_DIR }}/frontend/Dockerfile
          tags: ${{ env.FRONTEND_IMAGE }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          load: true
          # Reading the cache is always allowed; WRITING it is not allowed
          # for a pull request from a fork (the cache service answers 403),
          # so the export only happens for a push to master.
          cache-from: type=gha
          cache-to: ${{ env.IS_RELEASE == 'true' && 'type=gha,mode=max' || '' }}

      # The images must carry the commit they were built from — the VPS
      # refuses to run an image whose revision label does not match the
      # commit it is deploying.
      - name: Images carry their commit revision
        run: |
          set -euo pipefail
          for ref in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            revision="$(docker image inspect \
              --format '{{ if .Config.Labels }}{{ index .Config.Labels "org.opencontainers.image.revision" }}{{ end }}' \
              "$ref")"
            if [ "$revision" != "${GITHUB_SHA}" ]; then
              echo "::error::${ref} carries revision '${revision}', expected ${GITHUB_SHA}"
              exit 1
            fi
          done
          echo "OK: both images carry revision ${GITHUB_SHA}"

      - name: Backend image smoke test (gunicorn + /live/)
        run: |
          set -euo pipefail
          # Dummy non-secret settings: enough for production settings to
          # import and gunicorn to serve; no DB/Redis reachable or needed
          # for the liveness endpoint.
          docker run -d --name ci-backend \
            -e DJANGO_SECRET_KEY=ci-dummy-secret-key-ci-dummy-secret-key-0123456789 \
            -e ENCRYPTION_KEY=ci-dummy-encryption-key \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            -e DB_PASSWORD=ci-dummy \
            -e REDIS_URL=redis://ci.invalid:6379/0 \
            "$BACKEND_IMAGE"
          ok=0
          for _ in $(seq 1 20); do
            if docker exec ci-backend python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live/', timeout=3)" \
              >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ "${ok}" != "1" ]; then
            echo "::error::backend image did not serve /live/ — logs:"
            docker logs ci-backend
            docker rm -f ci-backend
            exit 1
          fi
          echo "OK: backend image serves /live/"
          docker rm -f ci-backend

      - name: Frontend image smoke test (next start + /)
        run: |
          set -euo pipefail
          docker run -d --name ci-frontend "$FRONTEND_IMAGE"
          ok=0
          for _ in $(seq 1 20); do
            if docker exec ci-frontend node -e \
              "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" \
              >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ "${ok}" != "1" ]; then
            echo "::error::frontend image did not serve / — logs:"
            docker logs ci-frontend
            docker rm -f ci-frontend
            exit 1
          fi
          echo "OK: frontend image serves /"
          docker rm -f ci-frontend

      # ---- publish ---------------------------------------------------------
      # Only a push to master publishes. The token is the workflow's own
      # GITHUB_TOKEN (packages: write) — no long-lived credential is used
      # and none is stored anywhere.
      - name: Log in to GitHub Container Registry
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GitHub Container Registry
        if: env.IS_RELEASE == 'true'
        run: |
          set -euo pipefail
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
          # Pull once more so the local image records the manifest digest
          # the registry serves — that digest is what the VPS verifies.
          docker pull "$BACKEND_IMAGE"
          docker pull "$FRONTEND_IMAGE"
          echo "OK: pushed ${BACKEND_IMAGE} and ${FRONTEND_IMAGE}"

      # The deploy workflow reads this artifact and makes the VPS verify
      # the pulled images against these digests: the SHA tag is only
      # "immutable" in practice if the bytes behind it are pinned too.
      - name: Record image digests
        if: env.IS_RELEASE == 'true'
        run: |
          set -euo pipefail
          # The digest of the manifest the REGISTRY serves for this tag:
          # the RepoDigest whose repository matches the image name. Picking
          # the first RepoDigest would be wrong as soon as the daemon knows
          # more than one repository for the same image.
          digest_of() {
            local ref="$1" repo
            repo="${ref%:*}"
            docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref" \
              | grep -F "${repo}@" | head -n 1 | sed 's/.*@//'
          }
          backend_digest="$(digest_of "$BACKEND_IMAGE")"
          frontend_digest="$(digest_of "$FRONTEND_IMAGE")"
          for d in "$backend_digest" "$frontend_digest"; do
            printf '%s' "$d" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
              echo "::error::could not determine the registry digest of the published image: '${d}'"
              exit 1
            }
          done
          {
            echo "GIT_SHA=${GITHUB_SHA}"
            echo "BACKEND_IMAGE=${BACKEND_IMAGE}"
            echo "BACKEND_DIGEST=${backend_digest}"
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}"
            echo "FRONTEND_DIGEST=${frontend_digest}"
          } > image-digests.env
          {
            echo "### Published images"
            echo ""
            echo "| Image | Tag | Digest |"
            echo "|---|---|---|"
            echo "| \`${BACKEND_IMAGE}\` | \`${GITHUB_SHA}\` | \`${backend_digest}\` |"
            echo "| \`${FRONTEND_IMAGE}\` | \`${GITHUB_SHA}\` | \`${frontend_digest}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image digests
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-digests
          path: image-digests.env
          if-no-files-found: error
          overwrite: true
          retention-days: 90
