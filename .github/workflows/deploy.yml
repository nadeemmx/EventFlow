name: Deploy

on:
  # Deploy only after a CI run that was triggered by a push to master.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  # Manual escape hatch (explicit human decision; no CI gate).
  workflow_dispatch:

# Least privilege: everything privileged happens over SSH with the deploy key.
# actions: read is needed to read the image digests CI published for the
# commit that is being deployed.
permissions:
  contents: read
  actions: read

# Deployment lock: only one production deployment at a time. Never cancel a
# deployment that is already running — queue behind it instead.
concurrency:
  group: eventflow-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    env:
      SSH_HOST: ${{ secrets.VPS_HOST }}
      SSH_USER: ${{ secrets.VPS_USER }}
      SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      HOST_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
      # Non-secret build input: CI bakes this origin into the frontend
      # image; the deploy verifies the pulled image carries it.
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # --------------------------------------------------------------
      # 0. Fail clearly when required configuration is missing, instead
      #    of letting SSH fail with an opaque error halfway through.
      # --------------------------------------------------------------
      - name: Validate configuration
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SSH_HOST}" ]    || missing+=("secret VPS_HOST")
          [ -n "${SSH_USER}" ]    || missing+=("secret VPS_USER")
          [ -n "${SSH_KEY}" ]     || missing+=("secret VPS_SSH_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub configuration: ${missing[*]}. Add them under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          # SSH_PORT is provided by the job env (secret VPS_PORT, default 22).
          # ShellCheck only inspects the run script, sees no assignment, and
          # suggests SSH_HOST as a possible typo — suppress exactly SC2153 here.
          # shellcheck disable=SC2153
          if ! printf '%s' "${SSH_PORT}" | grep -Eq '^[0-9]+$'; then
            echo "::error::secret VPS_PORT must be numeric, got: ${SSH_PORT}"
            exit 1
          fi
          if [ -z "${NEXT_PUBLIC_API_URL}" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_API_URL is not set — CI bakes it into the frontend image and the deploy verifies the pulled image carries it."
            exit 1
          elif ! printf '%s' "${NEXT_PUBLIC_API_URL}" | grep -Eq '^https?://[A-Za-z0-9.:-]+(/[A-Za-z0-9._~%+:-]*)*$'; then
            echo "::error::variable NEXT_PUBLIC_API_URL must be an absolute http(s) URL, got: ${NEXT_PUBLIC_API_URL}"
            exit 1
          else
            echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}"
          fi
          echo "Target: ${SSH_USER}@${SSH_HOST}:${SSH_PORT} (commit ${DEPLOY_SHA})"
          if [ -n "${KNOWN_HOSTS}" ]; then
            echo "Host key pinning: VPS_SSH_KNOWN_HOSTS is set"
          elif [ -n "${HOST_FINGERPRINT}" ]; then
            echo "Host key pinning: VPS_SSH_FINGERPRINT is set"
          else
            echo "Host key pinning: none pinned yet (ssh-keyscan TOFU; a fingerprint notice is printed below)"
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # --------------------------------------------------------------
      # 1. Locate the CI run that published the images for this commit.
      #    A workflow_run trigger knows it; a manual run looks it up.
      # --------------------------------------------------------------
      - name: Locate the publishing CI run
        id: ci-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -n "${TRIGGER_RUN_ID}" ]; then
            run_id="${TRIGGER_RUN_ID}"
          else
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
          fi
          if [ -z "${run_id}" ]; then
            echo "::error::no successful CI run found for commit ${DEPLOY_SHA} — no images were published for it, refusing to deploy"
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "CI run ${run_id} published the images for ${DEPLOY_SHA}"

      # --------------------------------------------------------------
      # 2. The digests CI recorded for the published images. The VPS
      #    verifies the images it pulls against them — that is what makes
      #    the SHA tag immutable in practice.
      # --------------------------------------------------------------
      - name: Download the published image digests
        uses: actions/download-artifact@v8
        with:
          name: image-digests
          path: digests
          run-id: ${{ steps.ci-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the published image digests
        id: images
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail
          file="digests/image-digests.env"
          if [ ! -f "$file" ]; then
            echo "::error::the image-digests artifact does not contain image-digests.env — the CI run did not publish images for this commit"
            exit 1
          fi
          value_of() { sed -n "s/^$1=//p" "$file" | tail -n 1; }
          git_sha="$(value_of GIT_SHA)"
          backend_image="$(value_of BACKEND_IMAGE)"
          backend_digest="$(value_of BACKEND_DIGEST)"
          frontend_image="$(value_of FRONTEND_IMAGE)"
          frontend_digest="$(value_of FRONTEND_DIGEST)"

          [ "${git_sha}" = "${DEPLOY_SHA}" ] || {
            echo "::error::the published images belong to commit ${git_sha}, not ${DEPLOY_SHA}"
            exit 1
          }
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          expected_backend="ghcr.io/${owner}/eventflow-backend:${DEPLOY_SHA}"
          expected_frontend="ghcr.io/${owner}/eventflow-frontend:${DEPLOY_SHA}"
          [ "${backend_image}" = "${expected_backend}" ] || {
            echo "::error::unexpected backend image reference: ${backend_image} (expected ${expected_backend})"
            exit 1
          }
          [ "${frontend_image}" = "${expected_frontend}" ] || {
            echo "::error::unexpected frontend image reference: ${frontend_image} (expected ${expected_frontend})"
            exit 1
          }
          printf '%s' "${backend_digest}"  | grep -Eq '^sha256:[0-9a-f]{64}$' || {
            echo "::error::unexpected backend digest: ${backend_digest}"; exit 1; }
          printf '%s' "${frontend_digest}" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
            echo "::error::unexpected frontend digest: ${frontend_digest}"; exit 1; }

          {
            echo "backend_image=${backend_image}"
            echo "backend_digest=${backend_digest}"
            echo "frontend_image=${frontend_image}"
            echo "frontend_digest=${frontend_digest}"
          } >> "$GITHUB_OUTPUT"
          echo "OK: ${backend_image} (${backend_digest})"
          echo "OK: ${frontend_image} (${frontend_digest})"

      # --------------------------------------------------------------
      # 3. SSH with host-key verification. Never uses StrictHostKeyChecking=no.
      #    Pinning order:
      #      1. VPS_SSH_KNOWN_HOSTS secret (exact known_hosts entry) — best.
      #      2. ssh-keyscan + VPS_SSH_FINGERPRINT secret — verified match.
      #      3. ssh-keyscan only — TOFU; the fingerprint is printed as a notice
      #         so the operator can pin it afterwards.
      # --------------------------------------------------------------
      - name: Set up SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Private key (tolerates \n-escaped PEMs and stray CRLF).
          if printf '%s' "${SSH_KEY}" | grep -q '\\n'; then
            printf '%b\n' "${SSH_KEY}" | tr -d '\r' > ~/.ssh/deploy_key
          else
            printf '%s\n' "${SSH_KEY}" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key -P "" >/dev/null 2>&1; then
            echo "::error::secret VPS_SSH_KEY is not a valid unencrypted private key (password-protected keys are not supported for unattended deploys)"
            exit 1
          fi

          : > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if [ -n "${KNOWN_HOSTS}" ]; then
            printf '%s\n' "${KNOWN_HOSTS}" >> ~/.ssh/known_hosts
            echo "Using pinned known_hosts from VPS_SSH_KNOWN_HOSTS"
            ssh-keygen -lf ~/.ssh/known_hosts | sed 's/^/  /'
          else
            scanned=$(mktemp)
            for attempt in 1 2 3; do
              if ssh-keyscan -T 15 -p "${SSH_PORT}" "${SSH_HOST}" > "${scanned}" 2>/dev/null && [ -s "${scanned}" ]; then
                break
              fi
              echo "ssh-keyscan attempt ${attempt} failed; retrying in 5s..."
              sleep 5
            done
            if [ ! -s "${scanned}" ]; then
              echo "::error::Could not reach ${SSH_HOST}:${SSH_PORT} to obtain the SSH host key. Check VPS_HOST/VPS_PORT and the server firewall."
              exit 1
            fi
            cat "${scanned}" >> ~/.ssh/known_hosts
            fingerprint=$(ssh-keygen -lf "${scanned}" | head -1 | awk '{print $2}')
            if [ -n "${HOST_FINGERPRINT}" ]; then
              if ! ssh-keygen -lf "${scanned}" | grep -Fq "${HOST_FINGERPRINT}"; then
                echo "::error::SSH host key fingerprint mismatch for ${SSH_HOST}:${SSH_PORT}. Expected: ${HOST_FINGERPRINT}. Got: ${fingerprint}. Refusing to connect."
                exit 1
              fi
              echo "Host key fingerprint verified against VPS_SSH_FINGERPRINT"
            else
              echo "::notice title=Unpinned SSH host key::ssh-keyscan fetched ${fingerprint}. Pin it in the VPS_SSH_FINGERPRINT secret (or paste the entry into VPS_SSH_KNOWN_HOSTS) so future runs verify against it."
            fi
            rm -f "${scanned}"
          fi

      # --------------------------------------------------------------
      # 4. Docker Compose deployment (deploy_compose.sh): scp the script +
      #    shared lib to the VPS, then run it with the SHA to deploy. The
      #    script fetches the repo checkout, validates the compose config,
      #    PULLS the images CI published for that SHA (it never builds),
      #    applies migrations explicitly, switches the stack, health-gates
      #    through nginx and auto-rolls back to the previous known-good
      #    tag on failure.
      # --------------------------------------------------------------
      - name: Deploy (Docker Compose)
        id: deploy
        env:
          BACKEND_DIGEST: ${{ steps.images.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.images.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          # The digests were validated against a strict pattern in the
          # previous step — they are content hashes, never secrets.
          SSH_OPTS=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${HOME}/.ssh/known_hosts" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15)
          scp -P "${SSH_PORT}" -i "${HOME}/.ssh/deploy_key" "${SSH_OPTS[@]}" \
            deploy/docker/deploy_compose.sh deploy/docker/scripts/lib.sh \
            "${SSH_USER}@${SSH_HOST}:/tmp/"

          ssh -p "${SSH_PORT}" -i "${HOME}/.ssh/deploy_key" "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "chmod +x /tmp/deploy_compose.sh && \
             NEXT_PUBLIC_API_URL='${NEXT_PUBLIC_API_URL}' \
             EVENTFLOW_EXPECTED_API_URL='${NEXT_PUBLIC_API_URL}' \
             EVENTFLOW_EXPECTED_BACKEND_DIGEST='${BACKEND_DIGEST}' \
             EVENTFLOW_EXPECTED_FRONTEND_DIGEST='${FRONTEND_DIGEST}' \
             bash /tmp/deploy_compose.sh '${DEPLOY_SHA}'"

      # --------------------------------------------------------------
      # Post-deployment verification ON the VPS (verify.sh, from the
      # deployed checkout): container health states, nginx -t in the
      # container, HTTP behavior through nginx, migration state, media
      # mount writability, image tags. This validates that the deployment
      # landed; the next step validates the live application from outside.
      # --------------------------------------------------------------
      - name: Post-deployment verification (on VPS)
        id: verify
        run: |
          set -euo pipefail
          SSH_OPTS=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${HOME}/.ssh/known_hosts" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15)
          ssh -p "${SSH_PORT}" -i "${HOME}/.ssh/deploy_key" "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
            "bash /srv/baseify/eventflow/repo/deploy/docker/scripts/verify.sh"

      # --------------------------------------------------------------
      # Live application test FROM the GitHub runner over the public
      # address (frontend, health, readiness incl. DB/Redis, API auth).
      # Distinct from the step above: that one proves the deployment
      # landed, this one proves end users can actually use the app.
      # --------------------------------------------------------------
      - name: Live application test (from GitHub runner)
        id: live
        env:
          BASE_URL: ${{ vars.PUBLIC_BASE_URL || format('http://{0}', secrets.VPS_HOST) }}
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL%/}"
          expect() {
            local label="$1" path="$2" want="$3" code="000"
            for attempt in 1 2 3 4 5; do
              # curl prints 000 itself when the connection fails.
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${BASE_URL}${path}" 2>/dev/null || true)
              code="${code:-000}"
              if [ "${code}" = "${want}" ]; then
                echo "[OK] ${label} → ${code}"
                return 0
              fi
              sleep 6
            done
            echo "[FAIL] ${label} → ${code} (expected ${want}) at ${BASE_URL}${path} after ${attempt} attempts"
            return 1
          }
          failed=0
          expect "frontend HTML"        "/"                  "200" || failed=1
          expect "backend /health/"     "/health/"           "200" || failed=1
          expect "backend /ready/ (DB+Redis)" "/ready/"      "200" || failed=1
          expect "API requires auth"    "/api/v1/tenants/"   "401" || failed=1
          if [ "${failed}" -ne 0 ]; then
            echo "::error::Live application test failed for ${BASE_URL} — the deployment may have landed, but the app is not healthy end to end."
            exit 1
          fi
          echo "Live application test passed: ${BASE_URL}"

      - name: Write deployment summary
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          BACKEND_DIGEST: ${{ steps.images.outputs.backend_digest }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend_image }}
          FRONTEND_DIGEST: ${{ steps.images.outputs.frontend_digest }}
          PUBLIC_URL: ${{ vars.PUBLIC_BASE_URL || format('http://{0}', secrets.VPS_HOST) }}
        run: |
          {
            echo "## Production deployment (Docker Compose)"
            echo ""
            echo "| Stage | Result | Meaning |"
            echo "|---|---|---|"
            echo "| Deployment (deploy_compose.sh) | \`${DEPLOY_OUTCOME}\` | Images pulled, migrations, stack on the VPS |"
            echo "| On-VPS verification | \`${VERIFY_OUTCOME}\` | Containers healthy, nginx, migrations, media |"
            echo "| Live application test (external) | \`${LIVE_OUTCOME}\` | ${PUBLIC_URL} usable end to end |"
            echo ""
            echo "- Commit: \`${DEPLOY_SHA}\`"
            echo "- Backend image: \`${BACKEND_IMAGE}\` (\`${BACKEND_DIGEST}\`)"
            echo "- Frontend image: \`${FRONTEND_IMAGE}\` (\`${FRONTEND_DIGEST}\`)"
            echo "- The images are built and published by CI; the VPS only PULLS them (no \`docker build\`, no \`npm ci\` on the server)."
            echo "- Lock: concurrency group \`eventflow-production\` (queued, never cancelled)"
            echo ""
            echo "### Rollback (run on the VPS as the deploy user)"
            echo '```bash'
            echo "cd /srv/baseify/eventflow/repo"
            echo "deploy/docker/scripts/rollback.sh            # → previous known-good SHA (pulls its images)"
            echo "deploy/docker/scripts/rollback.sh <SHA>      # → an explicit earlier SHA"
            echo '```'
            echo ""
            echo "Backups: \`/srv/baseify/eventflow/backups\` (\`backup.sh\`, cron 02:00, 14-day retention; restore with \`restore.sh db|media <file> --yes\`)."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Deployment pipeline failed for commit ${DEPLOY_SHA} — see the failed step above. deploy_compose.sh auto-rolls back to the previous known-good tag when its own health gate fails; for failures after that gate (e.g. on-VPS verification or the live test) use the rollback commands in the job summary."
